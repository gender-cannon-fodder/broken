<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="%PLACEHOLDER_INDEX_DIR%">
<title>Halfsphere</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #06060f;
    font-family: monospace;
    color: #556;
  }
  canvas {
    cursor: crosshair;
    display: block;
    width: 100%; height: 100%;
  }
  p {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<p>steer with cursor — right-click + hold → boost forward</p>
<script type="module" src="bundle.js"></script>
</body>
</html>
